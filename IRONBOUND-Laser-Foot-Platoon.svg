s-serif" font-size="10.2" text-anchor="start">One attack / one target per round. Semicolons separate damage groups: one attack roll, separate locations.</text><text x="22" y="586" fill="#243540" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.3" text-anchor="start">Incoming damage removes troop pips; no location roll. Firepower changes at the phase boundary.</text><text x="22" y="604" fill="#243540" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="start">No operating heat, armor or separate Structure. No Extreme-range attacks.</text><text x="22" y="622" fill="#61717c" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" text-anchor="start">Supply: no shot counters. Rearm after deployment: 1,000 C-bills / 1 day. Replace: 1,000 C-bills per trooper / 1 day.</text><path d="M22 637H977" stroke="#83919a" fill="none" /><text x="22" y="655" fill="#243540" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">Recruitment 25,000 C-bills</text><text x="345" y="655" fill="#243540" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="bold">Operating cost 1,000 C-bills/day</text><text x="977" y="655" fill="#243540" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end">Personnel included</text></svg>